    family: A
    reliability: 92
    url: http://stat.wharton.upenn.edu/~steele/Courses/434/434Context/PairsTrading/PairsTradingGGR.pdf

  - name: Frazzini & Pedersen 2014 - Betting Against Beta
    family: A
