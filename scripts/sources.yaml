# Knowledge source manifest for scripts/download_sources.py
#
# This drives a *legitimate* downloader: it fetches ONLY the public,
# free-to-redistribute material listed here into library/<family>/, ready for
# scripts/ingest_knowledge.py. It deliberately does NOT include copyrighted
# books — per docs/sme_knowledge_base.md §4.8, books are read and distilled into
# your own notes, never bulk-downloaded.
#
# Each source:
#   name:        human label (also the output filename, slugified)
#   family:      A | B | C | RISK | all   (decides the library/ sub-folder)
#   url:         direct file URL (mode: file) OR a page to scan (mode: page)
#   reliability: 0-100, carried into ingestion (official > generic). Optional.
#   mode:        "file" (default) downloads the URL; "page" scans an HTML page
#                for same-domain document links (pdf/docx/xls/xlsx/csv by
#                default) and downloads them. Page mode reads only that one page
#                (no crawling) and ignores JS-rendered link lists.
#   enabled:     set false to keep an entry as a documented TODO (skipped).
#
# Add your own vetted URLs over time. Only http/https are allowed; the script
# respects robots.txt, rate-limits, and skips files already present.

settings:
  user_agent: "ats-knowledge-downloader/1.0 (+local research; respects robots.txt)"
  rate_limit_s: 2.0          # polite pause between requests
  timeout_s: 30.0
  respect_robots: true
  max_file_mb: 100           # abort a single download past this size
  max_page_links: 25         # cap docs pulled from one mode:page source
  # Document types mode:page collects. Override to narrow/broaden, e.g. [pdf].
  document_exts: [pdf, docx, doc, xls, xlsx, csv]

sources:
  # ----------------------------------------------------------------------- #
  # Family A — open-access factor / strategy papers (free author/uni copies) #
  # ----------------------------------------------------------------------- #
