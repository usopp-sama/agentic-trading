# Production-leaning compose. For v1 the app runs fine standalone (SQLite +
# in-memory bus); this brings up Postgres/TimescaleDB, Redis, and Qdrant for
# the scaled deployment. Hardened per the container security guidelines:
# non-root, no docker socket, localhost-only exposure, resource limits.

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        INSTALL_EXTRAS: "true"   # build Postgres/Redis drivers into the image
    restart: unless-stopped
    # Optional: the app boots in mock/SQLite mode even if .env is missing.
    env_file:
      - path: ../.env
        required: false
    environment:
      ATS_DB_URL: postgresql+psycopg://ats:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/ats
      ATS_EVENT_BUS: redis
      ATS_REDIS_URL: redis://redis:6379/0
      # In-memory vector store today; switch to a service-backed store once wired.
      ATS_VECTOR_STORE: memory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Default exposes ONLY on localhost (this scaled stack expects a reverse
    # proxy + TLS in front). For a quick LAN trial use docker-compose.lan.yml,
    # or set ATS_BIND=0.0.0.0 here behind a trusted network / VPN.
    ports:
      - "${ATS_BIND:-127.0.0.1}:8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - app_data:/app/var
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ats
      # No insecure default: set a strong POSTGRES_PASSWORD in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ats
    volumes:
      - pg_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app_data:
  pg_data:
  redis_data:
