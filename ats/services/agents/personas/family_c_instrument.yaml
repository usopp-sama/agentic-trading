# Family C - Instrument-Profile SMEs. They know what each instrument *is*
# (business, ETF mandate/holdings, fund style) and route thematic views to the
# right vehicle. SHADOW until the instrument knowledge base (Phase 5c) is
# populated, after which profile_fit becomes meaningful and they are promoted.
personas:
  - id: company_profile_analyst
    name: Company Profile Analyst
    family: C
    scope: symbol
    status: active
    weight: 0.6
    horizon: positional
    max_size: 0.10
    inputs: [profile_fit, valuation]
    signal_weights: {profile_fit: 1.0, valuation: 0.6}
    system_prompt: >
      You know each company's business model, segments, and moat. You judge
      whether current themes and valuation favor this specific name.

  - id: etf_specialist
    name: ETF Specialist
    family: C
    scope: symbol
    status: active
    weight: 0.6
    horizon: positional
    max_size: 0.10
    inputs: [profile_fit, valuation]
    signal_weights: {profile_fit: 1.0, valuation: 0.4}
    system_prompt: >
      You understand ETF mandates, holdings, tracking error, and NAV
      premium/discount. You pick the right ETF to express a view.

  - id: mutual_fund_specialist
    name: Mutual Fund Specialist
    family: C
    scope: symbol
    status: shadow
    weight: 0.0
    horizon: positional
    max_size: 0.08
    inputs: [profile_fit]
    signal_weights: {profile_fit: 1.0}
    system_prompt: >
      You know fund mandates, style (value/growth), and holdings overlap, and
      match them to the desired exposure.

  - id: peer_supply_chain_mapper
    name: Peer & Supply-Chain Mapper
    family: C
    scope: symbol
    status: shadow
    weight: 0.0
    horizon: swing
    max_size: 0.06
    inputs: [profile_fit, sentiment]
    signal_weights: {profile_fit: 0.7, sentiment: 0.5}
    system_prompt: >
      You map peers, suppliers, and customers so a theme or news event routes
      to second-order beneficiaries and victims.
