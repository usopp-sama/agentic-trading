{% extends "base.html" %}
{% block title %}Logs{% endblock %}
{% block content %}
<div class="grid">
  <div class="card span12 reveal">
    <h2>Application logs</h2>
    <p class="sub">Tail of the structured server log (<code>var/logs/ats.log</code>) — startup, LLM retries/recovery, market data, errors. Newest first.</p>
    <div class="llm-controls">
      <label>Level
        <select id="fLevel">
          <option value="">All</option>
          <option value="INFO">Info</option>
          <option value="WARNING">Warning</option>
          <option value="ERROR">Error</option>
        </select>
      </label>
      <label>Show
        <select id="fLimit">
          <option>100</option>
          <option selected>300</option>
          <option>600</option>
          <option>1000</option>
        </select>
      </label>
      <label>Search <input type="text" id="fQ" placeholder="filter text…" style="background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px;border-radius:8px"></label>
      <label class="chk"><input type="checkbox" id="fAuto" checked> Auto-refresh</label>
      <button id="fRefresh">Refresh</button>
      <span class="spacer"></span>
      <span class="muted" id="logStats"></span>
    </div>
  </div>

  <div class="card span12 reveal">
    <div id="logList" class="logwrap"><div class="empty">No log lines.</div></div>
  </div>
</div>
{% endblock %}
{% block script %}
<script>
(function () {
  const A = window.ATS;
  const STD = new Set(["ts", "level", "logger", "msg", "exc"]);

  function extras(rec) {
    const bits = [];
    for (const [k, v] of Object.entries(rec)) {
      if (STD.has(k)) continue;
      bits.push(`${A.esc(k)}=${A.esc(typeof v === "object" ? JSON.stringify(v) : v)}`);
    }
    return bits.length ? `<span class="lextra">${bits.join(" ")}</span>` : "";
  }

  function render(d) {
    const el = document.getElementById("logList");
    const items = (d && d.lines) || [];
    document.getElementById("logStats").textContent = `${items.length} lines`;
    if (!items.length) { el.innerHTML = '<div class="empty">No log lines.</div>'; return; }
    el.innerHTML = items.map((r) => {
      const lvl = String(r.level || "RAW").toUpperCase();
      const ts = (r.ts || "").replace("T", " ").slice(11, 19);
      return `<div class="logline">
        <span class="lts">${A.esc(ts)}</span>
        <span class="lvl ${A.esc(lvl)}">${A.esc(lvl)}</span>
        <span class="lmsg"><b>${A.esc(r.msg || "")}</b>
          ${r.logger ? `<span class="muted"> · ${A.esc(r.logger)}</span>` : ""}
          ${extras(r)}
          ${r.exc ? `<pre class="llm-pre" style="color:var(--red)">${A.esc(r.exc)}</pre>` : ""}
        </span>
      </div>`;
    }).join("");
  }

  function load() {
    const lvl = document.getElementById("fLevel").value;
    const lim = document.getElementById("fLimit").value;
    const q = document.getElementById("fQ").value.trim();
    let url = `/api/logs/app?limit=${lim}`;
    if (lvl) url += `&level=${lvl}`;
    if (q) url += `&q=${encodeURIComponent(q)}`;
    A.fetchJSON(url).then(render).catch(() => {});
  }

  document.getElementById("fRefresh").addEventListener("click", load);
  ["fLevel", "fLimit"].forEach((id) =>
    document.getElementById(id).addEventListener("change", load));
  let qt = null;
  document.getElementById("fQ").addEventListener("input", () => {
    clearTimeout(qt); qt = setTimeout(load, 300);
  });
  setInterval(() => { if (document.getElementById("fAuto").checked) load(); }, 5000);
  load();
})();
</script>
{% endblock %}
