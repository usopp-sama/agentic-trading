{% extends "base.html" %}
{% block title %}News{% endblock %}
{% block content %}
<div class="grid">
  <div class="card span12 reveal">
    <div class="charttools" style="margin:0">
      <input id="tickerFilter" placeholder="Filter by ticker (e.g. TCS)" autocomplete="off">
      <div class="seg" id="sentSeg">
        <button data-s="" class="sel">All</button>
        <button data-s="positive">Positive</button>
        <button data-s="negative">Negative</button>
        <button data-s="neutral">Neutral</button>
      </div>
      <span class="spacer"></span>
      <span class="muted" id="newsCount"></span>
    </div>
  </div>
  <div class="card span12 reveal">
    <h2>News outlet</h2>
    <p class="sub">Read here — no need to leave the dashboard</p>
    <div class="newslist" id="feed"><div class="empty">Loading…</div></div>
  </div>
</div>

<div class="reader" id="reader">
  <button class="x icon-btn" id="readerClose">✕</button>
  <div id="readerBody"></div>
</div>
{% endblock %}
{% block script %}
<script>
(function () {
  const A = window.ATS;
  let sentiment = "", ticker = "";

  async function load() {
    const q = new URLSearchParams({ limit: 60 });
    if (sentiment) q.set("sentiment", sentiment);
    if (ticker) q.set("ticker", ticker);
    const d = await A.fetchJSON("/api/news?" + q.toString());
    const el = document.getElementById("feed");
    document.getElementById("newsCount").textContent = (d.total || 0) + " items";
    if (!d.news || !d.news.length) { el.innerHTML = '<div class="empty">No matching news.</div>'; return; }
    el.innerHTML = d.news.map((n) => {
      const s = (n.sentiment && n.sentiment.label) || "neutral";
      return `<div class="newsrow" data-id="${n.id}"><span class="sdot ${s}"></span><div style="flex:1">
        <div class="ttl">${A.esc(n.title)}</div>
        <div class="sub">${A.esc(n.source)} · ${(n.tickers||[]).map(A.esc).join(", ") || "—"} · ${A.ago(n.ts)} ago
          ${n.event_type && n.event_type!=='general' ? '· <span class="tag">'+A.esc(n.event_type)+'</span>' : ''}</div>
        <div class="sub" style="color:var(--text);opacity:.8">${A.esc(n.summary || "")}</div>
      </div></div>`;
    }).join("");
    el.querySelectorAll(".newsrow").forEach((r) => r.onclick = () => openReader(r.dataset.id));
  }

  async function openReader(id) {
    const n = await A.fetchJSON("/api/news/" + id);
    if (n.error) return;
    const s = n.sentiment ? `<span class="sdot ${n.sentiment.label}"></span> ${A.esc(n.sentiment.label)} (${A.fmt(n.sentiment.score)})` : "";
    document.getElementById("readerBody").innerHTML = `
      <div class="muted" style="font-size:12px">${A.esc(n.source)} · ${A.ago(n.ts)} ago · ${s}</div>
      <h2>${A.esc(n.title)}</h2>
      <div>${(n.tickers||[]).map((t)=>`<a class="tag" href="/charts#${A.esc(t)}">${A.esc(t)}</a>`).join("")}</div>
      <div class="body">${A.esc(n.body || "(no extracted body — open the source)")}</div>
      ${n.url ? `<p style="margin-top:16px"><a href="${A.esc(n.url)}" target="_blank" rel="noopener noreferrer">Open source ↗</a></p>` : ""}`;
    document.getElementById("reader").classList.add("open");
  }
  document.getElementById("readerClose").onclick = () => document.getElementById("reader").classList.remove("open");
  document.querySelectorAll("#sentSeg button").forEach((b) => b.onclick = () => {
    sentiment = b.dataset.s; document.querySelectorAll("#sentSeg button").forEach((x) => x.classList.toggle("sel", x === b)); load();
  });
  const tf = document.getElementById("tickerFilter");
  tf.addEventListener("keydown", (e) => { if (e.key === "Enter") { ticker = tf.value.trim().toUpperCase(); load(); } });

  A.on("event", (m) => { if (m.topic === "news.item") load(); });
  load();
})();
</script>
{% endblock %}
